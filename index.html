<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>For You</title>
<meta name="theme-color" content="#150a2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Great+Vibes&family=Marcellus&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TOKENS — the same dusk-to-night sky as before (this is the
     part that worked). Single theme by design.
     ============================================================ */
  :root{
    --sky-top:      #150a2e;
    --sky-mid:      #3a1a52;
    --sky-horizon:  #7c4470;
    --warm-glow:    #c98fa0;
    --ink:          #fbf3f8;
    --ink-dim:      #dcc9dd;
    --ink-faint:    #b39ec4;
    --gold:         #e0a8b8;
    --gold-bright:  #fbe0e6;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --tx: 0; --ty: 0;
    --horizon-warmth: 0;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{
    position:fixed; inset:0; width:100%; height:100dvh;
    background:
      radial-gradient(ellipse 140% 55% at 50% 100%, color-mix(in srgb, var(--warm-glow) calc(35% + var(--horizon-warmth) * 30%), transparent) 0%, transparent 62%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-horizon) 100%);
    transition:background 1s ease;
    color:var(--ink);
    font-family:'Marcellus', Georgia, 'Times New Roman', serif;
    font-weight:300;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{ font:inherit; color:inherit; cursor:pointer; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
  h1,h2,p{ margin:0; text-wrap:balance; }
  button:focus-visible{ outline:2px solid var(--gold); outline-offset:4px; border-radius:50%; }

  /* ============================================================
     BACKGROUND — stars, drifting clouds, ambient rising fireflies
     ============================================================ */
  #sky{ position:fixed; inset:0; z-index:0; overflow:hidden; transition:opacity 1.4s ease; }
  #skyFar, #skyNear{ position:absolute; inset:-10%; transition:transform .5s ease-out; }
  #skyFar{ transform:translate3d(calc(var(--tx) * 6px), calc(var(--ty) * 6px), 0); }
  #skyNear{ transform:translate3d(calc(var(--tx) * 14px), calc(var(--ty) * 14px), 0); }
  body.finale-glow #sky{ opacity:.35; }

  .bg-star{
    position:absolute; border-radius:50%; background:#fff;
    animation:twinkle var(--dur,4s) ease-in-out infinite;
    animation-delay:var(--delay,0s);
  }
  @keyframes twinkle{
    0%,100%{ opacity:var(--min-op,.15); transform:scale(1); }
    50%{ opacity:var(--max-op,.85); transform:scale(1.2); }
  }
  /* ---------- Moon, with its light trickling down ---------- */
  #moon{
    position:absolute; top:9%; right:13%; width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff8ea, #f6dce4 55%, var(--gold) 100%);
    box-shadow:0 0 30px 8px rgba(224,168,184,.4), 0 0 70px 24px rgba(179,157,219,.18);
  }
  .moon-shine{
    position:absolute; border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 6px 2px rgba(224,168,184,.75);
    opacity:0;
    animation-name:shineFall; animation-timing-function:ease-in; animation-iteration-count:infinite;
  }
  @keyframes shineFall{
    0%{ transform:translate(0,0); opacity:0; }
    12%{ opacity:.9; }
    70%{ opacity:.45; }
    100%{ transform:translate(var(--drift,10px), var(--fall,40vh)); opacity:0; }
  }

  #ambient{ position:fixed; inset:0; z-index:1; overflow:hidden; pointer-events:none; }
  .firefly{
    position:absolute; bottom:-5%; border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 6px 2px rgba(224,168,184,.75);
    opacity:0;
    animation-name:fireflyRise; animation-timing-function:ease-in-out; animation-iteration-count:infinite;
  }
  @keyframes fireflyRise{
    0%{ transform:translate(0,0); opacity:0; }
    12%{ opacity:.85; } 50%{ transform:translate(var(--drift,10px), -55vh); }
    88%{ opacity:.45; } 100%{ transform:translate(calc(var(--drift,10px) * -1), -105vh); opacity:0; }
  }
  .shooting-star{
    position:absolute; width:120px; height:2px; border-radius:2px; opacity:0;
    background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.85) 75%, #fff 100%);
    transform-origin:right center; animation:shoot linear forwards;
  }
  @keyframes shoot{
    0%{ opacity:0; transform:rotate(var(--angle,210deg)) translateX(0); }
    8%{ opacity:1; } 78%{ opacity:.7; }
    100%{ opacity:0; transform:rotate(var(--angle,210deg)) translateX(var(--dist,-260px)); }
  }
  .spark-burst{
    position:absolute; width:5px; height:5px; border-radius:50%;
    background:#fff; box-shadow:0 0 10px 3px var(--sc, rgba(224,168,184,.9));
    opacity:0; animation:sparkPop ease-out forwards;
  }
  @keyframes sparkPop{
    0%{ opacity:0; transform:translateY(0) scale(.4); } 15%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-32vh) scale(1); }
  }
  .finale-fly{
    box-shadow:0 0 12px 5px rgba(224,168,184,.95);
  }
  #finaleFlash{
    position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 55%, rgba(251,224,230,.85), rgba(224,168,184,.25) 40%, transparent 70%);
  }
  #finaleFlash.show{ animation:finaleBloom 2.6s ease forwards; }
  @keyframes finaleBloom{
    0%{ opacity:0; }
    35%{ opacity:.8; }
    100%{ opacity:0; }
  }

  /* ============================================================
     SCREENS
     ============================================================ */
  main{ position:fixed; inset:0; z-index:2; }
  .screen{
    position:absolute; inset:0; height:100dvh;
    opacity:0; pointer-events:none; transition:opacity 1s ease;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  .eyebrow{
    font-weight:500; text-transform:uppercase; letter-spacing:.24em;
    font-size:.72rem; color:var(--ink-faint);
  }
  .cursive-glow{
    font-family:'Great Vibes', cursive; color:var(--gold-bright);
    text-shadow:0 0 14px rgba(224,168,184,.7), 0 0 42px rgba(201,143,160,.35);
  }

  /* ---------- Intro ---------- */
  #intro .intro-content{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding:0 28px;
  }
  #intro .eyebrow{ opacity:0; animation:fadeUp 1s ease forwards; animation-delay:.2s; }
  #introTitle{
    font-size:clamp(2.5rem,13vw,4rem);
    opacity:0; animation:fadeUp 1.2s ease forwards; animation-delay:.6s;
  }
  /* A small swarm of fireflies flies in from every edge, drifts and
     dances loosely around the center for a moment, then settles away
     as the title takes over — the opening greeting. */
  #introGatherLayer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  #introFlash{
    position:absolute; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 46%, rgba(224,168,184,.4), transparent 62%);
    animation:introBloom 2.8s ease forwards;
    animation-delay:1.3s;
  }
  @keyframes introBloom{
    0%{ opacity:0; } 45%{ opacity:1; } 100%{ opacity:0; }
  }
  .gather-mote{
    position:absolute; left:50%; top:46%; border-radius:50%;
    background:var(--gold-bright);
    opacity:0; transform:translate(-50%,-50%);
    animation-name:gatherArrive;
    animation-timing-function:cubic-bezier(.22,1,.36,1);
    animation-fill-mode:forwards;
    animation-delay:var(--gd,0s);
  }
  .gather-mote.dance{ animation-name:gatherDance; }
  @keyframes gatherArrive{
    0%{ transform:translate(calc(-50% + var(--sx,0px)), calc(-50% + var(--sy,0px))) scale(1); opacity:0; }
    16%{ opacity:1; }
    62%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    82%{ transform:translate(-50%,-50%) scale(1.15); opacity:.9; }
    100%{ transform:translate(-50%,-50%) scale(.15); opacity:0; }
  }
  @keyframes gatherDance{
    0%{ transform:translate(calc(-50% + var(--sx,0px)), calc(-50% + var(--sy,0px))) scale(1); opacity:0; }
    16%{ opacity:1; }
    50%{ transform:translate(calc(-50% + var(--ox,10px)), calc(-50% + var(--oy,-10px))) scale(1); opacity:1; }
    75%{ transform:translate(calc(-50% + var(--ox2,-10px)), calc(-50% + var(--oy2,8px))) scale(.95); opacity:.85; }
    100%{ transform:translate(-50%,-50%) scale(.15); opacity:0; }
  }
  .tap-hint{
    margin-top:4px; display:inline-flex; align-items:center; gap:10px;
    background:transparent; border:0; color:var(--ink-dim);
    letter-spacing:.1em; font-size:.95rem; padding:14px 16px; min-height:44px;
    opacity:0; animation:fadeUp 1s ease forwards, pulseHint 2.6s ease-in-out 2.2s infinite;
    animation-delay:1.6s;
  }
  .tap-hint-dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px 3px rgba(224,168,184,.7); flex:none; }
  .locked-note{
    margin-top:2px; font-style:italic; font-size:.92rem; color:var(--ink-faint);
    opacity:0; animation:fadeUp 1s ease forwards; animation-delay:1.3s;
  }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes pulseHint{ 0%,100%{ opacity:.65; } 50%{ opacity:1; } }

  /* ---------- Catch stage ---------- */
  #catchStage{ overflow:hidden; }
  .progress-wrap{
    position:absolute; top:calc(18px + var(--safe-t)); left:0; right:0; z-index:3;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .progress-text{ font-size:.85rem; letter-spacing:.06em; color:var(--ink-dim); }

  #targetFirefly{
    position:absolute; width:64px; height:64px; transform:translate(-50%,-50%);
    left:50%; top:50%;
    background:transparent; border:0; padding:0;
    display:flex; align-items:center; justify-content:center;
    transition:left 3.6s ease-in-out, top 3.6s ease-in-out, opacity .5s ease, transform .4s ease;
    z-index:2;
  }
  #targetFirefly.hidden{ opacity:0; pointer-events:none; }
  .ff-halo{
    position:absolute; width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle, rgba(224,168,184,.55), transparent 70%);
    animation:ffHaloPulse 1.8s ease-in-out infinite;
  }
  @keyframes ffHaloPulse{ 0%,100%{ transform:scale(1); opacity:.7; } 50%{ transform:scale(1.6); opacity:1; } }
  .ff-core{
    position:relative; width:11px; height:11px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--gold-bright) 55%, var(--gold) 100%);
    box-shadow:0 0 14px 4px rgba(224,168,184,.9);
    animation:ffBob 2.4s ease-in-out infinite;
  }
  @keyframes ffBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
  #targetFirefly:active .ff-core{ transform:scale(.85); }

  .catch-burst{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:#fff; box-shadow:0 0 10px 3px rgba(224,168,184,.9);
    pointer-events:none; opacity:1;
    animation:catchPop .7s ease-out forwards;
  }
  @keyframes catchPop{
    0%{ transform:translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(var(--bx,0), var(--by,0)) scale(.2); opacity:0; }
  }

  .stage-footer{
    position:absolute; bottom:calc(24px + var(--safe-b)); left:0; right:0; z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding:0 24px; text-align:center;
  }
  .stage-hint{ font-style:italic; font-size:.92rem; color:var(--ink-faint); transition:opacity .5s ease; }
  #catchStage .stage-back-btn{ width:auto; max-width:260px; }

  /* ---------- Reveal overlay — the firefly's light expands from the
     exact point it was caught into a full-screen glow, and collapses
     back down to that same point when closed. No sliding sheet. ---------- */
  #revealOverlay{
    position:fixed; inset:0; z-index:20;
    background:
      radial-gradient(circle at var(--rx,50%) var(--ry,50%), rgba(80,50,40,.97) 0%, rgba(20,8,22,.985) 70%);
    clip-path:circle(0% at var(--rx,50%) var(--ry,50%));
    transition:clip-path .95s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    padding:calc(50px + var(--safe-t)) 26px calc(50px + var(--safe-b));
  }
  #revealOverlay.open{
    clip-path:circle(145% at var(--rx,50%) var(--ry,50%));
    pointer-events:auto;
  }
  /* Rings and drifting motes that bloom outward from the exact
     catch point as the glow expands — the opening flourish. */
  #revealFx{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .reveal-ring{
    position:absolute; left:var(--rx); top:var(--ry);
    width:14px; height:14px; margin:-7px 0 0 -7px;
    border:1.5px solid rgba(251,224,230,.55);
    border-radius:50%;
    transform:scale(0); opacity:0;
    animation:ringExpand 1.8s ease-out forwards;
    animation-delay:var(--ring-delay,0s);
  }
  @keyframes ringExpand{
    0%{ transform:scale(0); opacity:.85; }
    100%{ transform:scale(42); opacity:0; }
  }
  .reveal-mote{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:var(--gold-bright); box-shadow:0 0 6px 2px rgba(224,168,184,.8);
    opacity:0; animation:moteFloat ease-in-out infinite;
    animation-delay:var(--mote-delay,0s);
  }
  @keyframes moteFloat{
    0%{ opacity:0; transform:translate(0,0); }
    15%{ opacity:.85; }
    50%{ transform:translate(var(--mx,10px), var(--my,-16px)); }
    85%{ opacity:.5; }
    100%{ opacity:0; transform:translate(0,0); }
  }

  .reveal-inner{
    position:relative; z-index:1;
    max-width:480px; width:100%; max-height:100%;
    display:flex; flex-direction:column; text-align:center;
    opacity:0; transform:translateY(10px) scale(.95);
    transition:opacity .6s ease, transform .6s ease;
  }
  #revealOverlay.open .reveal-inner{
    opacity:1; transform:translateY(0) scale(1);
    transition-delay:.4s;
  }
  /* The firefly "settles" at the top of the glow before its message
     is written out; it shrinks away right as the typing begins. */
  .reveal-spark{
    flex:none; position:relative; width:100%; height:30px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:6px;
    opacity:0; transform:scale(.4);
    transition:opacity .5s ease, transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  #revealOverlay.open .reveal-spark.show{ opacity:1; transform:scale(1); }
  .reveal-spark.settle{ opacity:0; transform:scale(.3) translateY(-6px); transition:opacity .5s ease, transform .5s ease; }
  .reveal-spark .ff-halo{
    position:absolute; width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle, rgba(224,168,184,.55), transparent 70%);
    animation:ffHaloPulse 1.4s ease-in-out infinite;
  }
  .reveal-spark .ff-core{
    position:relative; width:11px; height:11px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--gold-bright) 55%, var(--gold) 100%);
    box-shadow:0 0 14px 4px rgba(224,168,184,.9);
  }
  .reveal-body{ flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .reveal-text{
    font-family:'Cormorant Garamond', serif; font-weight:400; font-style:italic;
    font-size:clamp(1.15rem, 4.6vw, 1.45rem); line-height:1.8; color:var(--ink);
  }
  /* Shared word-by-word cascade — used by the firefly reveal text
     and the finale's closing message alike. */
  .word{
    display:inline-block; opacity:0; transform:translateY(10px); filter:blur(2px);
    transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1), filter .5s ease;
    transition-delay:var(--wd,0s);
  }
  .revealed .word{ opacity:1; transform:translateY(0); filter:blur(0); }
  .reveal-scroll-hint{
    position:sticky; bottom:0; left:0; right:0; height:36px; margin-top:-36px;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:2px;
    pointer-events:none; opacity:0; transition:opacity .35s ease;
  }
  .reveal-scroll-hint.visible{ opacity:1; }
  .reveal-scroll-hint .chevron{
    display:block; width:9px; height:9px;
    border-right:2px solid var(--reveal-accent, var(--gold));
    border-bottom:2px solid var(--reveal-accent, var(--gold));
    transform:rotate(45deg); animation:hintBounce 1.6s ease-in-out infinite;
  }
  @keyframes hintBounce{ 0%,100%{ transform:rotate(45deg) translate(0,0); } 50%{ transform:rotate(45deg) translate(3px,3px); } }
  .reveal-close{
    flex:none; margin-top:22px; align-self:center;
    padding:12px 26px; min-height:44px;
    border-radius:999px; border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.04); color:var(--ink-dim);
    letter-spacing:.04em; font-size:.9rem;
  }
  .reveal-close:active{ background:rgba(255,255,255,.09); }

  /* ---------- Finale ---------- */
  #finale{ overflow:hidden; }
  .finale-content{
    position:relative; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 30px; gap:8px;
  }
  .sparkles{ position:absolute; inset:-15% -8%; pointer-events:none; z-index:0; }
  .sparkle{
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:#fff; box-shadow:0 0 8px 2px rgba(255,255,255,.85);
    opacity:0; animation:sparklePop 2.4s ease-in-out infinite;
    animation-delay:var(--sdelay,0s);
  }
  @keyframes sparklePop{ 0%,100%{ opacity:0; transform:scale(.3); } 50%{ opacity:1; transform:scale(1); } }
  .finale-content > *{ position:relative; z-index:1; }
  .finale-content .eyebrow{ margin-bottom:6px; }

  /* Staged reveal — each piece arrives on its own, in order,
     rather than the whole finale fading in as one block. */
  .finale-content .eyebrow,
  .finale-name,
  .finale-message,
  .finale-signature,
  .finale-actions{
    opacity:0; transform:translateY(14px);
    transition:opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1);
  }
  .finale-content .eyebrow.show,
  .finale-name.show,
  .finale-message.show,
  .finale-signature.show,
  .finale-actions.show{
    opacity:1; transform:translateY(0);
  }
  .finale-name{
    font-size:clamp(3rem,16vw,5.2rem);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.22,1,.36,1), text-shadow 1.4s ease;
  }
  .finale-name.hold{
    text-shadow:0 0 22px rgba(224,168,184,.95), 0 0 60px rgba(201,143,160,.55);
  }
  .finale-message{
    margin-top:14px; font-family:'Cormorant Garamond', serif; font-weight:400; font-style:italic;
    font-size:1.05rem; line-height:1.8; max-width:32ch; color:#f5e6ea;
  }
  .finale-message.show{ opacity:.92; }
  .finale-signature{ margin-top:2px; font-family:'Great Vibes', cursive; font-size:1.3rem; color:var(--ink-dim); }
  .finale-signature.show{ opacity:.85; }
  .finale-actions{ margin-top:22px; display:flex; flex-direction:column; gap:12px; width:100%; max-width:320px; }
  .ghost-btn{
    width:100%; padding:13px 28px; min-height:44px;
    border-radius:999px; border:1px solid rgba(255,255,255,.25);
    background:transparent; color:var(--ink-dim); letter-spacing:.06em; font-size:.9rem;
  }
  .ghost-btn:active{ background:rgba(255,255,255,.06); }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.25s !important; }
    .firefly,.spark-burst,.moon-shine,.shooting-star,.catch-burst{ display:none; }
  }
  @media (max-height: 620px){
    .progress-wrap{ top:calc(10px + var(--safe-t)); }
    .stage-footer{ bottom:calc(12px + var(--safe-b)); }
    .stage-hint{ font-size:.82rem; }
    .card{ padding:22px 20px 18px; }
  }
</style>
</head>
<body>

  <div id="sky" aria-hidden="true">
    <div id="skyFar"></div>
    <div id="skyNear"></div>
    <div id="moon"></div>
  </div>
  <div id="ambient" aria-hidden="true"></div>
  <div id="finaleFlash" aria-hidden="true"></div>

  <main>
    <!-- ============ INTRO ============ -->
    <section id="intro" class="screen active">
      <div id="introGatherLayer" aria-hidden="true"></div>
      <div id="introFlash" aria-hidden="true"></div>
      <div class="intro-content">
        <p class="eyebrow">a few fireflies, just for you</p>
        <h1 id="introTitle" class="cursive-glow">For You</h1>
        <button id="beginBtn" class="tap-hint" type="button">
          <span class="tap-hint-dot"></span>
          <span>Tap to begin</span>
        </button>
      </div>
    </section>

    <!-- ============ CATCH STAGE ============ -->
    <section id="catchStage" class="screen">
      <header class="progress-wrap">
        <p class="progress-text" id="progressText" aria-live="polite">0 of 6 caught</p>
      </header>

      <button id="targetFirefly" type="button" aria-label="Catch the firefly">
        <span class="ff-halo"></span>
        <span class="ff-core"></span>
      </button>

      <div class="stage-footer">
        <p class="stage-hint" id="stageHint">Tap the glowing firefly</p>
        <button id="backToFinale" class="ghost-btn stage-back-btn" type="button" hidden>Back to your message</button>
      </div>
    </section>

    <!-- ============ FINALE ============ -->
    <section id="finale" class="screen">
      <div class="finale-content">
        <div class="sparkles" id="sparkles"></div>
        <p class="eyebrow" id="finaleEyebrow">every firefly is caught</p>
        <h1 class="cursive-glow finale-name" id="finaleName">You</h1>
        <p class="finale-message" id="finaleMessage"></p>
        <p class="finale-signature" id="finaleSignature"></p>
        <div class="finale-actions" id="finaleActions">
          <button id="replayBtn" class="ghost-btn" type="button">Chase them again</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ REVEAL — the firefly's light, expanded ============ -->
  <div id="revealOverlay">
    <div id="revealFx" aria-hidden="true"></div>
    <div class="reveal-inner">
      <div class="reveal-spark" id="revealSpark"><span class="ff-halo"></span><span class="ff-core"></span></div>
      <div class="reveal-body" id="revealBody">
        <p class="reveal-text" id="revealText"></p>
        <div class="reveal-scroll-hint" id="revealScrollHint" aria-hidden="true"><span class="chevron"></span></div>
      </div>
      <button id="revealClose" class="reveal-close" type="button">Tap to catch the next firefly</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* ============================================================
     CONFIG — edit these. One firefly is created per paragraph.
     ============================================================ */
  const CONFIG = {
    herName: "Sweetheart",
    introTitle: "A Little Letter for You",
    paragraphs: [
      "This is the first paragraph. Replace this placeholder with whatever you want to say first, maybe how you noticed her, or how things felt different once she was around.",
      "This is the second paragraph. A specific memory works well here, something small and exact tends to land harder than something general.",
      "This is the third paragraph. Maybe this is where you talk about something you admire about her, her laugh, her mind, the way she carries herself.",
      "This is the fourth paragraph. This could be where you get a little more vulnerable, something you don't usually say out loud.",
      "This is the fifth paragraph. Talk about the two of you here, an inside joke, a habit of hers you love, something only you two would understand.",
      "This is the sixth paragraph. You can close with the future here, something you're looking forward to together."
    ],
    closingMessage: "Every firefly you caught was a small piece of what I feel for you. I just wanted you to have all of it, in one place, whenever you want to read it again.",
    signature: "— Yours",
    unlockDate: null
  };

  const N = CONFIG.paragraphs.length;
  const ACCENTS = ["#e0a8b8", "#b39ddb", "#f3d9df"];
  const HINTS = [
    "Tap the glowing firefly",
    "One more when you're ready",
    "It's getting brighter out here",
    "More than halfway now",
    "Almost every firefly caught",
    "So close",
    "One firefly left"
  ];

  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.getElementById("introTitle").textContent = CONFIG.introTitle;
  document.getElementById("finaleName").textContent = CONFIG.herName;
  document.getElementById("finaleMessage").textContent = CONFIG.closingMessage;
  document.title = "For " + CONFIG.herName;
  document.getElementById("progressText").textContent = "0 of " + N + " caught";

  const signatureEl = document.getElementById("finaleSignature");
  if (CONFIG.signature && CONFIG.signature.trim()) signatureEl.textContent = CONFIG.signature;
  else signatureEl.remove();

  function isLocked(){
    if (!CONFIG.unlockDate) return false;
    return new Date() < new Date(CONFIG.unlockDate + "T00:00:00");
  }
  if (isLocked()){
    document.getElementById("beginBtn").remove();
    const daysLeft = Math.max(1, Math.ceil((new Date(CONFIG.unlockDate + "T00:00:00") - new Date()) / 86400000));
    const note = document.createElement("p");
    note.className = "locked-note";
    note.textContent = daysLeft <= 1 ? "Come back tomorrow." : ("Come back in " + daysLeft + " days.");
    document.querySelector("#intro .intro-content").appendChild(note);
  }

  /* ============================================================
     BACKGROUND — stars, clouds, ambient rising fireflies
     ============================================================ */
  function makeBgStars(container, count, sizeMin, sizeMax, topMax){
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++){
      const el = document.createElement("div");
      el.className = "bg-star";
      const size = (sizeMin + Math.random() * (sizeMax - sizeMin)).toFixed(2);
      el.style.left = (Math.random() * 100) + "%";
      el.style.top = (Math.random() * topMax) + "%";
      el.style.width = size + "px"; el.style.height = size + "px";
      el.style.setProperty("--dur", (3 + Math.random() * 4).toFixed(2) + "s");
      el.style.setProperty("--delay", (Math.random() * 6).toFixed(2) + "s");
      el.style.setProperty("--min-op", (0.1 + Math.random() * 0.15).toFixed(2));
      el.style.setProperty("--max-op", (0.55 + Math.random() * 0.35).toFixed(2));
      frag.appendChild(el);
    }
    container.appendChild(frag);
  }
  makeBgStars(document.getElementById("skyFar"), 45, 1, 2, 55);
  makeBgStars(document.getElementById("skyNear"), 25, 1.5, 2.6, 45);

  /* A gentle trickle of light falling from the moon. */
  function spawnMoonShine(){
    if (reduceMotion) return;
    const moonEl = document.getElementById("moon");
    const rect = moonEl.getBoundingClientRect();
    const el = document.createElement("div");
    el.className = "moon-shine";
    const size = 2 + Math.random() * 2;
    el.style.width = size + "px"; el.style.height = size + "px";
    el.style.left = (rect.left + rect.width * 0.5 + (Math.random() * 16 - 8)) + "px";
    el.style.top = (rect.top + rect.height * 0.65) + "px";
    el.style.setProperty("--drift", (Math.random() * 36 - 18).toFixed(0) + "px");
    el.style.setProperty("--fall", (22 + Math.random() * 22).toFixed(0) + "vh");
    el.style.animationDuration = (3 + Math.random() * 2) + "s";
    document.getElementById("ambient").appendChild(el);
    setTimeout(function(){ el.remove(); }, 5500);
  }
  (function scheduleMoonShine(){ spawnMoonShine(); setTimeout(scheduleMoonShine, 450 + Math.random() * 500); })();

  /* ---------- Intro: fireflies gathering into the glow ---------- */
  function spawnIntroGather(){
    if (reduceMotion) return;
    const layer = document.getElementById("introGatherLayer");
    const count = 16;
    for (let i = 0; i < count; i++){
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const dist = 100 + Math.random() * 130;
      const dance = i % 2 === 0;
      const size = 4 + Math.random() * 4;
      const accent = ACCENTS[i % ACCENTS.length];

      const el = document.createElement("div");
      el.className = "gather-mote" + (dance ? " dance" : "");
      el.style.width = size + "px";
      el.style.height = size + "px";
      el.style.boxShadow = "0 0 " + (6 + size) + "px " + (2 + size / 2) + "px " + hexToRgba(accent, 0.85);
      el.style.setProperty("--sx", (Math.cos(angle) * dist).toFixed(0) + "px");
      el.style.setProperty("--sy", (Math.sin(angle) * dist).toFixed(0) + "px");
      if (dance){
        el.style.setProperty("--ox", (Math.random() * 40 - 20).toFixed(0) + "px");
        el.style.setProperty("--oy", (Math.random() * 40 - 20).toFixed(0) + "px");
        el.style.setProperty("--ox2", (Math.random() * 40 - 20).toFixed(0) + "px");
        el.style.setProperty("--oy2", (Math.random() * 40 - 20).toFixed(0) + "px");
        el.style.animationDuration = (2.6 + Math.random() * 0.6) + "s";
      } else {
        el.style.animationDuration = (1.9 + Math.random() * 0.5) + "s";
      }
      el.style.setProperty("--gd", (i * 0.06).toFixed(2) + "s");
      layer.appendChild(el);
    }
  }
  spawnIntroGather();

  function spawnFirefly(){
    if (reduceMotion) return;
    const el = document.createElement("div");
    el.className = "firefly";
    const size = 2 + Math.random() * 3;
    el.style.width = size + "px"; el.style.height = size + "px";
    el.style.left = (Math.random() * 100) + "vw";
    el.style.setProperty("--drift", (Math.random() * 60 - 30) + "px");
    el.style.animationDuration = (7 + Math.random() * 6) + "s";
    document.getElementById("ambient").appendChild(el);
    setTimeout(function(){ el.remove(); }, 14000);
  }
  (function scheduleAmbientFireflies(){ spawnFirefly(); setTimeout(scheduleAmbientFireflies, 900 + Math.random() * 900); })();

  function spawnShootingStar(){
    if (reduceMotion) return;
    const el = document.createElement("div");
    el.className = "shooting-star";
    el.style.top = (Math.random() * 38) + "vh";
    el.style.left = (55 + Math.random() * 45) + "vw";
    el.style.animationDuration = (0.9 + Math.random() * 0.6) + "s";
    el.addEventListener("animationend", function(){ el.remove(); });
    document.getElementById("ambient").appendChild(el);
  }
  (function scheduleShootingStar(){ setTimeout(function(){ spawnShootingStar(); scheduleShootingStar(); }, 8000 + Math.random() * 9000); })();

  function hexToRgba(hex, alpha){
    const h = hex.replace("#","");
    return "rgba(" + parseInt(h.substring(0,2),16) + "," + parseInt(h.substring(2,4),16) + "," + parseInt(h.substring(4,6),16) + "," + alpha + ")";
  }
  function spawnSparkBurstAt(xPct, yPct){
    if (reduceMotion) return;
    const container = document.getElementById("ambient");
    for (let i = 0; i < 10; i++){
      const el = document.createElement("div");
      el.className = "spark-burst";
      const accent = ACCENTS[Math.floor(Math.random() * ACCENTS.length)];
      el.style.left = (xPct + (Math.random() * 10 - 5)) + "vw";
      el.style.top = (yPct + (Math.random() * 6 - 3)) + "vh";
      el.style.setProperty("--sc", hexToRgba(accent, 0.9));
      el.style.animationDuration = (1 + Math.random() * 0.8) + "s";
      el.style.animationDelay = (Math.random() * 0.3) + "s";
      el.addEventListener("animationend", function(){ el.remove(); });
      container.appendChild(el);
    }
  }
  function spawnFinaleShower(){
    if (reduceMotion) return;
    for (let i = 0; i < 6; i++){
      setTimeout(function(){ spawnSparkBurstAt(10 + Math.random() * 80, 20 + Math.random() * 50); }, i * 220);
    }
  }

  // A big, warm fountain of fireflies rising from the bottom of the
  // screen — the "everyone's out" celebration once all are caught.
  function spawnFinaleFountain(){
    if (reduceMotion) return;
    const container = document.getElementById("ambient");
    const count = 40;
    for (let i = 0; i < count; i++){
      setTimeout(function(){
        const el = document.createElement("div");
        el.className = "firefly finale-fly";
        const size = 3 + Math.random() * 3.5;
        el.style.width = size + "px"; el.style.height = size + "px";
        el.style.left = (Math.random() * 100) + "vw";
        el.style.setProperty("--drift", (Math.random() * 90 - 45) + "px");
        el.style.animationDuration = (3.5 + Math.random() * 2.5) + "s";
        container.appendChild(el);
        setTimeout(function(){ el.remove(); }, 7000);
      }, i * 45);
    }
  }
  function spawnFinaleSparkles(){
    const container = document.getElementById("sparkles");
    if (container.childElementCount > 0) return;
    const count = reduceMotion ? 0 : 22;
    for (let i = 0; i < count; i++){
      const s = document.createElement("div");
      s.className = "sparkle";
      s.style.left = (Math.random() * 100) + "%";
      s.style.top = (Math.random() * 100) + "%";
      s.style.setProperty("--sdelay", (Math.random() * 2.4).toFixed(2) + "s");
      container.appendChild(s);
    }
  }

  /* ============================================================
     PARALLAX TILT
     ============================================================ */
  let tiltScheduled = false;
  function setTilt(x,y){
    if (reduceMotion) return;
    if (tiltScheduled) return;
    tiltScheduled = true;
    requestAnimationFrame(function(){
      document.documentElement.style.setProperty("--tx", x.toFixed(3));
      document.documentElement.style.setProperty("--ty", y.toFixed(3));
      tiltScheduled = false;
    });
  }
  function handleOrientation(e){
    const gamma = Math.max(-24, Math.min(24, e.gamma || 0));
    const beta = Math.max(-24, Math.min(24, (e.beta || 0) - 40));
    setTilt(gamma/24, beta/24);
  }
  function handlePointerMove(e){
    setTilt((e.clientX/window.innerWidth-0.5)*2, (e.clientY/window.innerHeight-0.5)*2);
  }
  function enableParallax(){
    if (reduceMotion) return;
    if (window.matchMedia && window.matchMedia("(pointer: fine)").matches){
      window.addEventListener("mousemove", handlePointerMove, { passive:true });
    }
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
      DeviceOrientationEvent.requestPermission().then(function(state){
        if (state === "granted") window.addEventListener("deviceorientation", handleOrientation, { passive:true });
      }).catch(function(){});
    } else if (typeof DeviceOrientationEvent !== "undefined"){
      window.addEventListener("deviceorientation", handleOrientation, { passive:true });
    }
  }

  function hapticPulse(ms){
    if (navigator.vibrate){ try { navigator.vibrate(ms); } catch (e){} }
  }

  /* ============================================================
     TARGET FIREFLY — drifts to a new random spot every few
     seconds; tapping it "catches" it and reveals the next
     paragraph. Movement pauses while the card is open.
     ============================================================ */
  const targetEl = document.getElementById("targetFirefly");
  let moveTimer = null;
  let caughtCount = 0;
  let awaitingClose = false;

  function randomSpot(){
    const x = 18 + Math.random() * 64;   // keep clear of edges
    const y = 22 + Math.random() * 46;   // keep clear of header/footer
    return { x: x, y: y };
  }

  function driftTarget(){
    if (awaitingClose) return;
    const spot = randomSpot();
    const duration = 3 + Math.random() * 2.2;
    targetEl.style.transitionDuration = duration.toFixed(2) + "s";
    targetEl.style.left = spot.x + "%";
    targetEl.style.top = spot.y + "%";
    moveTimer = setTimeout(driftTarget, duration * 1000);
  }

  function startDrift(){
    const spot = randomSpot();
    targetEl.style.transitionDuration = "0s";
    targetEl.style.left = spot.x + "%";
    targetEl.style.top = spot.y + "%";
    requestAnimationFrame(function(){ driftTarget(); });
  }

  function catchBurstAt(el){
    if (reduceMotion) return;
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 10; i++){
      const spark = document.createElement("div");
      spark.className = "catch-burst";
      spark.style.left = cx + "px";
      spark.style.top = cy + "px";
      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 40;
      spark.style.setProperty("--bx", (Math.cos(angle) * dist) + "px");
      spark.style.setProperty("--by", (Math.sin(angle) * dist) + "px");
      spark.addEventListener("animationend", function(){ spark.remove(); });
      document.body.appendChild(spark);
    }
  }

  /* ============================================================
     STATE + CARD
     ============================================================ */
  const state = { openIndex: null, complete: false };
  const stageHint = document.getElementById("stageHint");
  const progressText = document.getElementById("progressText");
  const backToFinaleBtn = document.getElementById("backToFinale");
  const revealOverlay = document.getElementById("revealOverlay");
  const revealFx = document.getElementById("revealFx");
  const revealSpark = document.getElementById("revealSpark");
  const revealBody = document.getElementById("revealBody");
  const revealText = document.getElementById("revealText");
  const revealScrollHint = document.getElementById("revealScrollHint");

  let sparkTimer1 = null, sparkTimer2 = null;
  let cascadeTimer = null;

  function revealWordsCascade(el, text){
    clearTimeout(cascadeTimer);
    el.classList.remove("revealed");
    el.innerHTML = "";
    const words = text.split(" ");
    words.forEach(function(w, i){
      const span = document.createElement("span");
      span.className = "word";
      span.textContent = w + (i < words.length - 1 ? " " : "");
      span.style.setProperty("--wd", reduceMotion ? "0s" : (i * 45) + "ms");
      el.appendChild(span);
    });
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.classList.add("revealed");
        updateScrollHint();
      });
    });
  }
  function skipCascade(el){
    clearTimeout(cascadeTimer);
    el.querySelectorAll(".word").forEach(function(w){ w.style.setProperty("--wd", "0s"); });
    el.classList.add("revealed");
  }

  function updateScrollHint(){
    const overflowing = revealBody.scrollHeight > revealBody.clientHeight + 2;
    const nearBottom = revealBody.scrollTop + revealBody.clientHeight >= revealBody.scrollHeight - 6;
    revealScrollHint.classList.toggle("visible", overflowing && !nearBottom);
  }
  revealBody.addEventListener("scroll", updateScrollHint, { passive:true });

  function openCard(i){
    clearTimeout(moveTimer);
    awaitingClose = true;

    // Anchor the expanding glow to exactly where the firefly was caught.
    revealOverlay.style.setProperty("--rx", targetEl.style.left || "50%");
    revealOverlay.style.setProperty("--ry", targetEl.style.top || "50%");

    catchBurstAt(targetEl);
    hapticPulse(14);
    targetEl.classList.add("hidden");

    state.openIndex = i;
    const accent = ACCENTS[i % ACCENTS.length];
    revealOverlay.style.setProperty("--reveal-accent", accent);
    revealText.innerHTML = "";
    revealText.classList.remove("revealed");
    revealBody.scrollTop = 0;
    revealSpark.classList.remove("show", "settle");

    clearTimeout(sparkTimer1);
    clearTimeout(sparkTimer2);

    // Rings ripple outward from the catch point, and a few tiny
    // motes keep drifting inside the glow for as long as it's open.
    revealFx.innerHTML = "";
    if (!reduceMotion){
      for (let r = 0; r < 3; r++){
        const ring = document.createElement("div");
        ring.className = "reveal-ring";
        ring.style.setProperty("--ring-delay", (r * 0.18).toFixed(2) + "s");
        revealFx.appendChild(ring);
      }
      for (let m = 0; m < 7; m++){
        const mote = document.createElement("div");
        mote.className = "reveal-mote";
        mote.style.left = (10 + Math.random() * 80) + "%";
        mote.style.top = (20 + Math.random() * 55) + "%";
        mote.style.setProperty("--mx", (Math.random() * 30 - 15).toFixed(0) + "px");
        mote.style.setProperty("--my", (Math.random() * -26 - 8).toFixed(0) + "px");
        mote.style.animationDuration = (3 + Math.random() * 2.5).toFixed(2) + "s";
        mote.style.setProperty("--mote-delay", (Math.random() * 2).toFixed(2) + "s");
        revealFx.appendChild(mote);
      }
    }

    requestAnimationFrame(function(){
      revealOverlay.classList.add("open");
      // The firefly settles into the glow first...
      sparkTimer1 = setTimeout(function(){ revealSpark.classList.add("show"); }, 450);
      // ...then shrinks away as its message starts being written out.
      sparkTimer2 = setTimeout(function(){
        revealSpark.classList.add("settle");
        revealWordsCascade(revealText, CONFIG.paragraphs[i]);
      }, 450 + (reduceMotion ? 0 : 750));
      requestAnimationFrame(updateScrollHint);
    });
  }

  revealBody.addEventListener("click", function(){
    if (!revealText.classList.contains("revealed")) skipCascade(revealText);
  });

  function closeCard(){
    revealOverlay.classList.remove("open");
    clearTimeout(sparkTimer1);
    clearTimeout(sparkTimer2);
    clearTimeout(cascadeTimer);
    revealFx.innerHTML = "";
    const i = state.openIndex;
    state.openIndex = null;
    if (i === null || i === undefined) return;

    if (state.complete){
      awaitingClose = false;
      targetEl.classList.remove("hidden");
      driftTarget();
      return;
    }

    caughtCount++;
    document.documentElement.style.setProperty("--horizon-warmth", (caughtCount / N).toFixed(3));
    progressText.textContent = caughtCount + " of " + N + " caught";

    if (caughtCount < N){
      stageHint.textContent = HINTS[Math.min(caughtCount, HINTS.length - 1)];
      awaitingClose = false;
      targetEl.classList.remove("hidden");
      startDrift();
    } else {
      stageHint.style.opacity = "0";
      triggerFinale();
    }
  }

  let nextIndex = 0;
  targetEl.addEventListener("click", function(){
    if (awaitingClose) return;
    const i = state.complete ? Math.floor(Math.random() * N) : nextIndex;
    if (!state.complete) nextIndex++;
    openCard(i);
  });

  const finaleTimers = [];
  function playFinaleSequence(){
    const eyebrow = document.getElementById("finaleEyebrow");
    const name = document.getElementById("finaleName");
    const message = document.getElementById("finaleMessage");
    const signature = document.getElementById("finaleSignature");
    const actions = document.getElementById("finaleActions");

    finaleTimers.forEach(clearTimeout);
    finaleTimers.length = 0;

    [eyebrow, name, message, signature, actions].forEach(function(el){
      if (el) el.classList.remove("show");
    });
    name.classList.remove("hold");
    message.classList.remove("revealed");
    message.innerHTML = "";

    if (reduceMotion){
      [eyebrow, name, signature, actions].forEach(function(el){ if (el) el.classList.add("show"); });
      message.textContent = CONFIG.closingMessage;
      message.classList.add("show");
      return;
    }

    finaleTimers.push(setTimeout(function(){ eyebrow.classList.add("show"); }, 150));
    finaleTimers.push(setTimeout(function(){
      name.classList.add("show");
      finaleTimers.push(setTimeout(function(){ name.classList.add("hold"); }, 500));
    }, 700));
    finaleTimers.push(setTimeout(function(){
      message.classList.add("show");
      revealWordsCascade(message, CONFIG.closingMessage);
    }, 2100));
    const messageWords = CONFIG.closingMessage.split(" ").length;
    const afterMessage = 2100 + messageWords * 45 + 500;
    finaleTimers.push(setTimeout(function(){ signature.classList.add("show"); }, afterMessage));
    finaleTimers.push(setTimeout(function(){ actions.classList.add("show"); }, afterMessage + 500));
  }

  function triggerFinale(){
    const closeDelay = reduceMotion ? 0 : 300;
    const holdDuration = reduceMotion ? 200 : 2600;

    document.body.classList.add("finale-glow");
    const flash = document.getElementById("finaleFlash");

    setTimeout(function(){
      spawnFinaleFountain();
      spawnFinaleShower();
      flash.classList.add("show");
    }, closeDelay);

    setTimeout(function(){
      state.complete = true;
      document.getElementById("catchStage").classList.remove("active");
      document.getElementById("finale").classList.add("active");
      stageHint.textContent = "Tap the firefly to reread any message";
      stageHint.style.opacity = "1";
      backToFinaleBtn.hidden = false;
      spawnFinaleSparkles();
      playFinaleSequence();
    }, closeDelay + holdDuration);
  }

  /* ============================================================
     WIRE UP UI
     ============================================================ */
  const beginBtn = document.getElementById("beginBtn");
  if (beginBtn){
    beginBtn.addEventListener("click", function(){
      enableParallax();
      document.getElementById("intro").classList.remove("active");
      document.getElementById("catchStage").classList.add("active");
      startDrift();
    });
  }

  document.getElementById("revealClose").addEventListener("click", closeCard);
  revealOverlay.addEventListener("click", function(e){
    if (e.target === revealOverlay) closeCard();
  });

  document.getElementById("replayBtn").addEventListener("click", function(){
    document.getElementById("finale").classList.remove("active");
    document.getElementById("catchStage").classList.add("active");
    document.body.classList.remove("finale-glow");
    stageHint.textContent = "Tap the firefly to reread any message";
    awaitingClose = false;
    targetEl.classList.remove("hidden");
    startDrift();
  });
  backToFinaleBtn.addEventListener("click", function(){
    document.getElementById("catchStage").classList.remove("active");
    document.getElementById("finale").classList.add("active");
    playFinaleSequence();
  });

})();
</script>
</body>
</html>
